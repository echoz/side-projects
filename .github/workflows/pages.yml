name: Public site

on:
  push:
    branches: [main]
    paths: ["index.html", "styles.css", "pitwall/**", "marquee/**", "blackbox/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["index.html", "styles.css", "pitwall/**", "marquee/**", "blackbox/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stage only approved public assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          assets = ("index.html", "styles.css", "pitwall/index.html", "pitwall/styles.css",
                    "pitwall/favicon.svg", "pitwall/tui-capture.svg",
                    "pitwall/tui-capture.txt", "pitwall/tui-compact-capture.svg",
                    "pitwall/tui-compact-capture.txt", "pitwall/tui-cycling-capture.svg",
                    "pitwall/tui-cycling-capture.txt", "pitwall/tui-dials-capture.svg",
                    "pitwall/tui-dials-capture.txt", "pitwall/tui-replay-capture.svg",
                    "pitwall/tui-replay-capture.txt", "pitwall/tui-replay-compact-capture.svg",
                    "pitwall/tui-replay-compact-capture.txt", "pitwall/tui-menu-capture.svg",
                    "pitwall/tui-menu-capture.txt", "pitwall/transponder-large.png",
                    "pitwall/transponder-half.png", "pitwall/transponder-compact.png",
                    "marquee/index.html", "marquee/styles.css", "marquee/demo.js", "marquee/favicon.svg",
                    "blackbox/index.html", "blackbox/styles.css", "blackbox/demo.js", "blackbox/favicon.svg")
          for name in assets:
              source = Path(name)
              if not source.is_file() or source.is_symlink() or any(
                  parent.is_symlink() for parent in source.parents
              ):
                  raise SystemExit("Public assets must be regular files, never symlinks")
          destination = Path("_site")
          destination.mkdir()
          for name in assets:
              target = destination / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public project pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

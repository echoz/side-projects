name: Public site

on:
  push:
    branches: [main]
    paths: ["index.html", "styles.css", "pitwall/**", "marquee/**", "blackbox/**", "public-assets.json", "scripts/**", "tests/**", "package.json", "pnpm-lock.yaml", "playwright.config.js", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["index.html", "styles.css", "pitwall/**", "marquee/**", "blackbox/**", "public-assets.json", "scripts/**", "tests/**", "package.json", "pnpm-lock.yaml", "playwright.config.js", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned validation dependencies
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Validate packaging, syntax and browser behavior
        run: pnpm test
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public project pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
